# RADXOID per-app GPU override catalog.
# This file is data for an emulator/launcher using the POORD2ROID-style loader.
# It does not globally replace Android's Vulkan HAL.
version=1

[system]
backend=system
require_custom=0

[malisx2]
backend=malisx2
library=libvulkan_malisx2.so
require_custom=0
min_android_api=29
requires_device=/dev/mali0

# A custom profile must fail closed in the app loader when require_custom=1.
# The system profile remains the explicit recovery path.
