name: Copy release asset

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Release tag containing the source asset
        required: true
      target_tag:
        description: Release tag that receives the asset
        required: true
      asset_name:
        description: Exact release-asset filename
        required: true

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy asset between releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          mkdir package
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir package
          gh release upload "$TARGET_TAG" "package/$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
