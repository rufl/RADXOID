name: Build GUI installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
        default: v1.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install pyinstaller
      - name: Test installer backend
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build Linux executable
        run: |
          pyinstaller --onefile --windowed --name RADXOID-Installer \
            --distpath dist/out --workpath dist/work dist/installer/radxoid_installer.py
          mv dist/out/RADXOID-Installer dist/out/RADXOID-Installer-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: RADXOID-Installer-linux-x86_64
          path: dist/out/RADXOID-Installer-linux-x86_64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install pyinstaller
      - name: Test installer backend
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build Windows executable
        run: |
          pyinstaller --onefile --windowed --uac-admin --name RADXOID-Installer `
            --distpath dist/out --workpath dist/work dist/installer/radxoid_installer.py
          Get-Item dist/out/RADXOID-Installer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RADXOID-Installer-windows-x86_64
          path: dist/out/RADXOID-Installer.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            release-assets/RADXOID-Installer-linux-x86_64/RADXOID-Installer-linux-x86_64
            release-assets/RADXOID-Installer-windows-x86_64/RADXOID-Installer.exe
          fail_on_unmatched_files: true
          overwrite_files: true
